schema_version = "1.1.0"

[[layers]]
id = "000_typing"
order = 0
path = "pkgs/000_typing"
description = "Shared types, protocols, and field definitions, including native trace identity and execution fields."
same_layer_dependencies = "allowed"
allowed_dependency_layers = []

[[layers]]
id = "001_spec"
order = 1
path = "pkgs/001_spec"
description = "Declarative specifications and schemas for framework contracts."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing"]

[[layers]]
id = "002_model"
order = 2
path = "pkgs/002_model"
description = "Model definitions and metadata used by the framework."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec"]

[[layers]]
id = "010_core"
order = 10
path = "pkgs/010_core"
description = "Reusable framework primitives and shared trace wire validation, timeline projection, and rollups."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model"]

[[layers]]
id = "020_base"
order = 20
path = "pkgs/020_base"
description = "Base classes and interfaces for apps, routers, tables, hooks, engines, and sessions."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core"]

[[layers]]
id = "030_orm"
order = 30
path = "pkgs/030_orm"
description = "ORM mappings, persistence metadata, and database integration primitives."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base"]

[[layers]]
id = "040_atoms"
order = 40
path = "pkgs/040_atoms"
description = "Execution steps for ingress, validation, storage, transactions, and egress."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base", "030_orm"]

[[layers]]
id = "045_kernel"
order = 45
path = "pkgs/045_kernel"
description = "Execution planning, protocol chains, lifecycle sequencing, and kernel trace instrumentation."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base", "030_orm", "040_atoms"]

[[layers]]
id = "050_runtime"
order = 50
path = "pkgs/050_runtime"
description = "Runtime dispatch, plan execution, and delivery of trace samples."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base", "030_orm", "040_atoms", "045_kernel"]

[[layers]]
id = "060_ops"
order = 60
path = "pkgs/060_ops"
description = "Built-in CRUD, analytical, realtime, and transport operation families."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base", "030_orm", "040_atoms", "045_kernel", "050_runtime"]

[[layers]]
id = "070_concrete"
order = 70
path = "pkgs/070_concrete"
description = "Concrete app, router, table, and column implementations and their binding machinery."
same_layer_dependencies = "allowed"
allowed_dependency_layers = ["000_typing", "001_spec", "002_model", "010_core", "020_base", "030_orm", "040_atoms", "045_kernel", "050_runtime", "060_ops"]

[[layers]]
id = "080_facade"
order = 80
path = "pkgs/080_facade"
