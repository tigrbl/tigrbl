[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
testpaths = [
  "pkgs",
  "tests",
  "tools/ci/tests",
  "tools/release/tests",
]
norecursedirs = [
  ".git",
  ".tmp",
  ".uv-cache",
  ".venv",
  "docs/notes/archive",
]

[tool.readme_standards]
exclude = ["pkgs/deprecated", "pkgs/997_deprecated_pending_migration", "docs/notes/archive", "docs/examples/package-maintenance/src"]
[dependency-groups]
dev = [
  "aiosqlite>=0.19.0",
  "asyncpg>=0.30.0",
  "build>=1.2.0",
  "fastapi==0.136.0",
  "flake8>=7.0",
  "greenlet>=3.2.3",
  "gunicorn>=21.2.0",
  "hatchling>=1.27.0",
  "hypercorn>=0.16.0",
  "httpx>=0.27.0,<0.28",
  "jinja2>=3.1.4",
  "poetry-core>=1.0.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.10,<3",
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-benchmark>=4.0.0",
  "pytest-json-report>=1.5.0",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.1",
  "python-dotenv",
  "pyyaml",
  "requests>=2.32.3",
  "ruff>=0.11.0",
  "ssot-registry>=0.2.26",
  "sqlalchemy>=2.0",
  "tomli-w",
  "typing-extensions>=4.0",
  "uvicorn",
  "websockets>=13",
  "index-toml-contracts==0.3.0",
  "readme-standards==0.1.3; python_version >= \"3.11\"",
]

[tool.uv.workspace]
members = [
  "pkgs/000_typing/*",
  "pkgs/001_spec/*",
  "pkgs/002_model/*",
  "pkgs/010_core/*",
  "pkgs/020_base/*",
  "pkgs/030_orm/*",
  "pkgs/040_atoms/*",
  "pkgs/045_kernel/*",
  "pkgs/050_runtime/*",
  "pkgs/060_ops/*",
  "pkgs/070_concrete/*",
  "pkgs/080_facade/*",
  "pkgs/090_engines/*",
  "pkgs/110_backend/*",
  "pkgs/150_client/*",
  "pkgs/170_examples/*",
  "pkgs/210_tests/*",
  "pkgs/800_experimental/*",
  "pkgs/997_deprecated_pending_migration/*",
]
exclude = [
  "pkgs/170_examples/equivalence_contracts",
  "pkgs/170_examples/transport_surface_matrix_demo",
  "pkgs/170_examples/websocket_realtime_ops",
]
