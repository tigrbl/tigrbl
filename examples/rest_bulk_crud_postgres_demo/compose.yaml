services:
  frontend:
    build:
      context: ../..
      dockerfile: examples/rest_bulk_crud_postgres_demo_frontend/Dockerfile
    container_name: tigrbl-rest-bulk-crud-demo-frontend
    environment:
      BACKEND_UPSTREAM: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8002:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ../..
      dockerfile: examples/rest_bulk_crud_postgres_demo/Dockerfile
    container_name: tigrbl-rest-bulk-crud-demo-app
    environment:
      TIGRBL_REST_BULK_CRUD_POSTGRES_DEMO_HOST: postgres
      TIGRBL_REST_BULK_CRUD_POSTGRES_DEMO_PORT: "5432"
      TIGRBL_REST_BULK_CRUD_POSTGRES_DEMO_USER: tigrbl
      TIGRBL_REST_BULK_CRUD_POSTGRES_DEMO_PASSWORD: tigrbl
      TIGRBL_REST_BULK_CRUD_POSTGRES_DEMO_DB: tigrbl_rest_bulk_crud_demo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: tigrbl-rest-bulk-crud-demo-postgres
    environment:
      POSTGRES_DB: tigrbl_rest_bulk_crud_demo
      POSTGRES_USER: tigrbl
      POSTGRES_PASSWORD: tigrbl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigrbl -d tigrbl_rest_bulk_crud_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
