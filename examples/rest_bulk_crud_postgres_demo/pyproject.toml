[project]
name = "tigrbl-rest-bulk-crud-postgres-demo"
version = "0.1.0"
description = "Tigrbl RestBulkCrudTable PostgreSQL example."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "psycopg2-binary>=2.9,<3",
  "tigrbl",
  "tigrbl-engine-postgres",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<0.29",
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
tigrbl = { path = "../../pkgs/80_facade/tigrbl", editable = true }
tigrbl-engine-postgres = { path = "../../pkgs/90_engines/tigrbl_engine_postgres", editable = true }

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
testpaths = [
  "tests",
]
