body: |-
  Trace, qlog, diagnostics, replay, and rollup events preserve trace context and the semantic and concrete identities required for their event kind. For operations, carry correlation_id and invocation_id where assigned. Keep span_id and trace_id distinct from correlation and invocation identity. Trace an atom with atom_id, attempt_id, and runtime_plan_id. Preserve replay_id and original_attempt_id on replay records.
  
  HTTP ingress and egress preserve the HTTP request correlation_id, including errors. WebSocket operation records preserve the socket transport_session_id and the logical request correlation_id. Each decoded application message has an invocation_id. Supported JSON-RPC batches preserve one document invocation ID, the call index, and rpc_id where present. Notifications retain invocation identity.
  
  WebTransport records include transport_session_id and the accepted session’s correlation_id. Stream records include stream_id and stream_correlation_id. Datagram records preserve applicable datagram_id without stream fields. Keep those grouping fields stable across invocation traces. Transaction lifecycle records carry engine_session_id and transaction_id, and participant links retain attribution to each invocation or attempt. Shared transactions can link to multiple invocation traces.
  
  Verify HTTP error propagation, WebSocket per-request isolation, WT aggregation and stream drillback, distinct invocations for complete records, and shared transaction attribution. Missing required identity follows the declared trace contract violation policy.
