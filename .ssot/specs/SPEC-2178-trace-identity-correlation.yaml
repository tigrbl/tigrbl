summary: "Trace, qlog, diagnostics, replay, and rollup events preserve trace context and the semantic and concrete identities required for their event kind. For operations, carry correlation_id and invocation_id where assigned. Keep span_id and trace_id distinct from correlation and invocation identity. Trace an atom with atom_id, attempt_id, and runtime_plan_id. Preserve replay_id and original_attempt_id on replay records."
