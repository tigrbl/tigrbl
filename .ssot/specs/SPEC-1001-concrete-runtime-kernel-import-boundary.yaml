body: |-
  ## Contract
  
  1. `tigrbl_concrete` package source must not contain static imports from `tigrbl_kernel`.
  2. `tigrbl_concrete` package source must not contain literal dynamic import calls targeting `tigrbl_kernel`.
  3. Importing `tigrbl_concrete` must not load `tigrbl_kernel` into `sys.modules`.
  4. `pkgs/070_concrete/tigrbl_concrete/pyproject.toml` must not list `tigrbl-kernel` in required or optional dependencies.
  5. `tigrbl_runtime` remains the authorized package boundary for importing `tigrbl_kernel` and exposing the raw ASGI handoff to concrete.
  
  ## Required Verification
  
  - Static AST scan of `pkgs/070_concrete/tigrbl_concrete/tigrbl_concrete` for forbidden imports.
  - Dependency metadata scan of `pkgs/070_concrete/tigrbl_concrete/pyproject.toml`.
  - Isolated interpreter import probe proving `import tigrbl_concrete` does not load `tigrbl_kernel`.
  
  ## Non-Conformance
  
  A direct `tigrbl_concrete` import of `tigrbl_kernel`, a literal dynamic import of `tigrbl_kernel`, a direct package dependency on `tigrbl-kernel`, or transitive kernel loading during package import is release-blocking for this boundary.

  ## Public ASGI entry point

  Setup binds concrete app configuration, route registrations, and lifecycle handlers to the kernel entry point through the authorized package boundary. For each ASGI call, `TigrblApp.__call__` MUST pass the original `scope`, `receive`, and `send` to the runtime forwarder. The forwarder MUST pass exactly those objects to the configured kernel entry point under SPEC-1148.

  For HTTP, WebSocket, WebTransport, and lifespan, an integration test must observe the public app call reaching the configured kernel entry point through the runtime forwarder. The test must verify that the kernel calls the atoms projector and selects the plan. A behavioral bypass fails this contract even when the import checks pass.
