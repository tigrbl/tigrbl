body: |-
  Acquiring or reusing an engine session establishes engine_session_id independently of transaction creation. Assign one fresh transaction_id per actual explicit or implicit engine begin. A wrapper and its provider must produce exactly one start identity for the same begin. A rejected begin that opens no transaction produces no start identity. Joining uses the active ID. Savepoints use the enclosing transaction identity.
  
  Emit the same transaction ID at begin and through commit or rollback reporting. After a commit failure, retain active state while the transaction remains open and report an unknown outcome when the provider cannot resolve it. Clear active identity on confirmed end or session discard. Preserve lease/reset isolation and the engine’s declared transaction and rollback capabilities.
  
  One authorized owner controls the transaction lifecycle. Invocations and attempts may participate in that transaction through validated links. A shared batch has one transaction ID and a link to each participant. A new begin after rollback gets a new ID even on the same engine session. Verify explicit begin, read-path autobegin, duplicate begin observation, joined transactions, shared batch ownership, retry, failed commit, session reuse, and operations that start no transaction.
