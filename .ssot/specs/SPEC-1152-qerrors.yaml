body: |-
  ## Requirements

  Reject authenticated user/tenant quota exhaustion before HTTP streaming begins with 429
  and a stable subscription_quota_exceeded error. Use subscription_rate_exceeded with a
  bounded retry delay for rate exhaustion. Active-cap exhaustion has no fabricated precise
  retry time. Store/aggregate service unavailability is 503 with subscription_admission_unavailable,
  not a misleading user quota violation. Authorization errors preserve existing auth behavior.

  For existing WebSocket/WebTransport control lanes, return the corresponding correlated
  application error through existing framing/envelopes; never inject HTTP into a child stream
  or close a healthy shared carrier solely for one quota refusal. No new custom JSON envelope
  may replace an established JSON-RPC envelope. Unsubscribe/cleanup remains possible at cap.

  Expose effective quotas, configured provider, actual scope, active counts, renewal/fencing
  failures, and refusal counters. Redact credentials and identity; no unbounded per-user or
  per-tenant metric labels. Diagnostics distinguish configured from implemented/enforced.

  ## Acceptance

  Validate HTTP/SSE and persistent-channel outcomes, correlation/envelope preservation,
  existing-subscription progress, redaction, bounded diagnostics, and outage classification.
