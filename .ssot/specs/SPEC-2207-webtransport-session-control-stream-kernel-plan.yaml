summary: "A WebTransport control binding compiles a session-scoped loop that repeatedly reads uint32 big-endian length-prefixed JSON-RPC records, dispatches each operation through the canonical operation index, encodes the correlated response, and emits it with nonterminal continuation. Framing atoms own record boundaries, KernelPlan owns loop and dispatch composition, realtime sink atoms own asynchronous event lanes, and runtime owns only raw ASGI projection. Explicit control close or session disconnect terminates streams and cleans subscriptions and media sinks."
