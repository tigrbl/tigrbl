body: |-
  A WebTransport control binding compiles an inner loop for uint32 big-endian length-prefixed JSON-RPC records. The kernel plan dispatches each complete record through the canonical operation index. Framing and transport atoms encode and emit the correlated response with nonterminal continuation. SPEC-2108 governs the outer session, and SPEC-1153 governs terminal cleanup.

  A partial carrier read MUST dispatch no operation. When a read yields multiple complete records, the plan MUST dispatch each record once and preserve its reply and invocation identity. Completing an operation leaves the control stream open. A terminal control-stream event releases that stream's decoder state and attachments. A session-terminal event releases the remaining resources owned by the session.

  Verify split prefixes and payloads, multiple complete records in one read, and nonterminal replies on an open stream. Verify that control-stream termination leaves other lanes available unless the kernel plan also takes a session-terminal transition.

  ## Draft control-record identity extension

  Under SPEC-2208, the compiled control loop inherits the correlation_id allocated at WebTransport session acceptance and the stream_correlation_id assigned at establishment of its bidirectional control stream. Carry these fields and stream_id through record dispatch, error and reply telemetry, and nonterminal emission. Assign one fresh invocation_id only after decoding a complete JSON-RPC record. An incomplete read assigns no invocation ID. A read containing several complete records assigns a separate ID to each record. Keep rpc_id for matching protocol replies.

  ## Draft transport identity and subscription extension

  Use draft SPEC-2209 when the control record opens, resumes, or closes a subscription. Apply the binding-selected acknowledgement version at record completion. Carry logical subscription and destination metadata through continuing delivery. Close cleans up attachments owned by the closing carrier and leaves authorized resumed attachments intact.
