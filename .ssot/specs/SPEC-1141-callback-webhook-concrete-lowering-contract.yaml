body: |-
  ## Contract

  1. WebhookSpec and CallbackSpec are public authoring inputs under ADR-1210 once accepted. Concrete Webhook, DefineWebhook, and webhook_ctx normalize to WebhookSpec. Concrete Callback, DefineCallback, and callback_ctx normalize to CallbackSpec. Preserve the existing webhook decorator as a compatible authoring form.
  2. Concrete lowering converts WebhookSpec to PathSpec and a custom OpSpec with an HTTP POST binding. Register the result through the same REST operation path used by other mounted operations. Security dependencies, handler, response contract, and acknowledgement use that operation's normal lifecycle.
  3. Concrete lowering converts CallbackSpec to hooks scoped to an existing operation. Kernel compiles the declared timing and any runtime-owned completion gating. Atoms enforce phase and transaction legality. Runtime executes the plan and concrete remains the authoring owner.
  4. For strict after-emission delivery, use kernel completion metadata and the runtime completion fence together with the lowered hooks. POST_EMIT remains runtime-owned. Callback delivery must not introduce a second operation identity for the source request or a new public phase.
  5. The single built-in durable table, retry transitions and tracing are governed by SPEC-2210 and SPEC-2211.

  ## Required verification

  - Public specs round-trip through the supported schema and serialization surfaces.
  - Direct spec, concrete factory and context decorator converge on equivalent mounted REST operations or equivalent source-op hook plans.
  - A mounted webhook acknowledges an actual signed POST; a mounted sender reaches a receiver and records the configured attempt outcome.
  - Runtime boundary coverage proves authoring remains in concrete and POST_EMIT remains runtime-owned.
  - Surface matrix rows distinguish inbound webhook authoring from outbound callback authoring.
