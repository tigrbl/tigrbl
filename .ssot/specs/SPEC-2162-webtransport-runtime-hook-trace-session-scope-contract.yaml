body: |-
  Consume Tigrcorn WebTransport session identity, keep one isolated WT scope alive through disconnect, and expose lane metadata to hooks. Record actual hook execution for session, stream, datagram, dispatch, egress, error, and close paths.
  
  Allocate one correlation_id at WT session acceptance and preserve it across stream and datagram events. For each stream preserve the native stream_id and one stream_correlation_id established at stream open. Carry the session correlation on datagrams without stream fields. Preserve requester session_id separately from transport_session_id and record quic_connection_id when the adapter exposes it. New WT sessions receive fresh correlation even on the same QUIC connection.
  
  Allocate invocation_id after complete application-message decoding. On the bidirectional JSON-RPC control stream, prove that fragmented reads allocate no ID early and coalesced reads produce one invocation per decoded record. Verify an interleaved session with multiple streams and datagrams, correlation continuity through errors and close, and isolation from a second session.
