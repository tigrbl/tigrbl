body: |-
  Required parentage includes attempt_id to op_id, table_id, router_id, and app_id. Atom execution records the applicable atom_id, attempt_id, and runtime_plan_id. A replay references original_attempt_id. Scope stream_id and datagram_id to transport_session_id, and associate the transport session with session_id where requester session identity is resolved. Scope trace_id relationships according to event kind.
  
  A transaction_id belongs to engine_session_id. Invocation and attempt records associate with transactions through explicit participant links. A shared batch may have multiple links to one transaction, and a retry may create a second link from the same invocation to a distinct transaction. Verify both relationships and drillback from the transaction to all participants. Validate required owner scope independently of correlation fields and reject mismatched stream or transaction ownership. Preserve the relationships in rollups.

  ## Draft transport identity and subscription extension

  The connection identity can own multiple HTTP exchanges and WebSocket or WebTransport sessions. The upgrade or CONNECT request is linked as the originating exchange. Under draft SPEC-2209, a logical subscription relates to its opening invocation and current destination attachment, and a delivery links one publication with its recipient subscription. Subscription ownership can move on authorized resume. Preserve lease generation separately from logical identity.
