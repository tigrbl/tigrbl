body: |-
  ## Decision

  1. Core, base, concrete, facade, and runtime are separate ownership layers.
  2. `tigrbl_core` owns declarative specs and must not own public concrete authoring factories.
  3. `tigrbl_base` owns reusable abstract behavior and must not own one-off public construction factories.
  4. `tigrbl_concrete` owns user-facing classes, decorators, shortcuts, aliases, canonical factory implementations, and governed lowercase and CamelCase authoring forms. It lowers authoring forms into core specs.
  5. The `tigrbl` facade may re-export concrete-owned factories but must preserve identity, signature, descriptor kind, async behavior, return category, and side-effect contract. It must not independently reimplement a concrete-owned factory.
  6. Provider and session factories belong to the package owning those runtime semantics. An instance `provide()` accessor is not a construction factory when it only exposes materialized state.
  7. Concrete must not define canonical specs, own shared base abstractions, compile kernel plans, or execute runtime behavior.
  8. Runtime consumes compiled plans and must not expose authoring or lowering factories except tracked compatibility shims.
  9. Ownership is enforced through the factory surface manifest and architecture tests.

  ## Context

  The factory inventory exposed duplicate or misplaced implementations across base, concrete, facade, shortcut, provider, and experimental packages. ADR-1029 governs verb and alias semantics; this ADR governs implementation ownership.

  ## Consequences

  New public authoring factories begin in concrete. Facade and shortcut surfaces are identity-preserving re-exports unless explicitly manifested as compatibility wrappers. Architecture tests reject public construction factories in core, base, and runtime and reject independent facade reimplementations.

  ## Rejected alternatives

  - Using core or base as staging areas for public construction helpers.
  - Treating the facade as a parallel implementation owner.
  - Treating concrete as runtime or kernel compilation.
