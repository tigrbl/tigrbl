body: |-
  ## Decision
  
  1. `factories` is the canonical namespace for public construction and projection helpers. `shortcuts` and facades may re-export canonical surfaces but must not become parallel implementation owners.
  2. Public factory candidates are governed by semantic role and export status, not by verb spelling alone. Internal helpers and local closures are excluded unless exported as authoring API.
  3. `define` produces declarative configuration, a spec, or a definition without runtime initialization or external I/O.
  4. `derive` deterministically projects an existing definition, type, or initialized object into another type or configured surface. Registration performed by `derive` must be deterministic and local to the returned projection.
  5. `make` constructs a usable instance. Initialization, I/O, and async behavior are part of its declared contract and must not be hidden by an alias.
  6. `provide` exposes or acquires a runtime dependency. An instance `provide()` accessor is not a factory alias when it returns an existing object without construction, registration, initialization, or derivation. `provider_*` and `prov` are separate provider-factory vocabulary.
  7. Governed forms include standalone functions, qualified verb functions, direct aliases, facade and shortcut re-exports, wrappers, class methods, static methods, inherited factories, descriptor aliases, async factories, CamelCase authoring forms, provider factories, and instance accessors.
  8. Standalone factory names must qualify the constructed product (`makeColumn`, `makeOp`, etc.); a bare module-level `make` export is non-conforming. Direct aliases such as `acol = makeColumn`, `vcol = makeVirtualColumn`, and `op = makeOp` must preserve object identity. Re-exports must preserve identity, signature, annotations, descriptor behavior, async behavior, return category, and documented side effects.
  9. Wrapper aliases are compatibility surfaces, not direct aliases. They must delegate to one canonical owner, preserve or explicitly publish their signature, and carry deprecation/removal policy when noncanonical.
  10. CamelCase `Make*`, `Define*`, `Derive*`, and `Provide*` forms are concrete authoring forms. Lowercase forms are classified by the factory manifest.
  11. `tigrbl_concrete` owns public authoring factory implementations. `tigrbl` may re-export them. Core, base, and runtime must not own public concrete construction factories except tracked compatibility shims. Provider/session factories remain with their semantic owner.
  12. Every governed public surface must appear in the factory surface manifest. New unclassified public candidates fail conformance after inventory enforcement begins.
  
  ## Form classifications
  
  - standalone factory: module-level canonical callable;
  - identity alias: another name bound to the same callable;
  - re-export alias: the same callable exported through another module;
  - wrapper alias: delegating callable with distinct identity;
  - class/static/inherited/descriptor factory: binding behavior is normative;
  - async factory: awaitability is normative;
  - provider factory: constructs or acquires provider/session dependencies;
  - instance provider/accessor: exposes materialized state;
  - internal helper: non-public computation rather than authoring.
  
  ## Consequences
  
  Factory aliases become compatibility contracts. Facades cannot independently reimplement concrete-owned factories. Signature, descriptor, identity, return category, async behavior, and side effects are governed separately. Existing drift is classified before release-blocking enforcement. SPEC-2009 is the normative matrix.
  
  ## Rejected alternatives
  
  - Governing every function beginning with a factory verb.
  - Treating wrappers as identity aliases.
  - Treating `provide()` as construction solely because it appears beside factories.
  - Keeping shortcuts, facades, and concrete packages as parallel owners.
