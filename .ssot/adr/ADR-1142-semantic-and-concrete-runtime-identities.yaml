body: |-
  Tigrbl distinguishes semantic IDs for compiled objects from concrete runtime IDs. Semantic IDs include app_id, router_id, table_id, op_id, atom_id, hook_id, binding_id, runtime_plan_id, and schema_id. Concrete IDs include attempt_id, session_id, transport_session_id, stream_id, datagram_id, engine_session_id, transaction_id, trace_id, request_id, connection_id, client_id, replay_id, and invocation_id.
  
  Draft ADR-1207 defines correlation_id and stream_correlation_id as grouping fields and invocation_id as decoded-message identity. The requester’s session_id, the carrier’s transport_session_id, and the JSON-RPC wire rpc_id have distinct lifetimes. Draft ADR-1208 defines the engine-owned transaction identity. Runtime records preserve semantic owner identity and the applicable concrete IDs. Conformance verifies semantic ID stability across transports and concrete ID uniqueness within the applicable owner scope.

  ## Transport and subscription identity extension

  Connection identity and HTTP request identity may be inherited from the server. A locally allocated application request ID is scoped to the application request. Draft ADR-1209 defines subscription_id, lease_id, publication_id, and delivery identity as separate concrete values. The broker and quota store own their respective IDs.
