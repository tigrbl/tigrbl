body: |-
  ## Decision
  
  1. WebTransport is governed as a session transport with explicit native carriers: `session`, `bidi_stream`, `unidi_client_stream`, `unidi_server_stream`, and `datagram`.
  2. Those carriers are represented through `WebTransportBindingSpec.profile` or its normalized protocol-binding equivalent. Tigrbl does not introduce a cross-transport lane axis for this policy.
  3. `message` is not a peer native WebTransport transport profile.
  4. App-level message framing, including JSON, JSON-RPC, text, bytes, binary, or NDJSON where explicitly supported, is an inner payload concern inside a selected stream or datagram profile and is represented by a lane-local `FramingSpec`.
  5. `WebTransportBindingSpec` governs the outer transport/session layer without top-level app framing. It does not prove inner app-level framing support.
  6. WebTransport stream profiles may target record-oriented framings only when boundary rules are explicit.
  7. WebTransport datagram profiles exclude `jsonrpc` and `ndjson` by default because datagrams do not provide stream continuity or reliable record sequencing.
  8. NDJSON must not be implied as a WebTransport transport framing merely because it may later be used as an application payload shape inside a stream.
  9. WebTransport may not be claimed as first-class support until its event, atom-chain, executor, profile, inner-framing, and session-multiplexing evidence contracts pass.
  10. WebTransport implementation must not create a separate programming model outside BindingSpec and KernelPlan compilation.
  11. WebTransport session-multiplexing support is a distinct proof boundary. A lane-policy test, payload-classification test, or single-lane bridge test is insufficient to prove that one Tigrcorn-backed WebTransport session can carry multiple bidirectional streams, client-to-server unidirectional streams, server-to-client unidirectional streams, and datagrams.
  12. Table operations may bind to different WebTransport carriers under the same session. The operation binding must identify the selected carrier and, when needed, a lane name or purpose such as `control`, `events`, `upload`, or `presence`.
  13. When a WebTransport table declares a control stream, the first bidirectional stream may be reserved as the control stream. Control-stream reservation is protocol topology, while the selected control-stream payload shape remains a lane-local framing spec such as `JsonRpcFramingSpec`.
  
  ## Outer session ownership

  The kernel plan owns the outer WebTransport session loop across control streams, other bidirectional streams, unidirectional streams, and datagrams. It decides which events admit or continue a session, which events dispatch an operation, and which events terminate a stream or session. Runtime enters the selected session plan once per inbound ASGI session and drives it with the projected scope and carrier callables. Transport, framing, and cleanup atoms perform the effects selected by the plan. Concrete supplies binding registrations, handlers, lifecycle hooks, and configured broker and hub instances.

  Operation completion, stream termination, and session termination are distinct transitions. An operation can emit a reply while its stream remains open. Stream termination releases state attached to that stream and leaves other lanes available. Session termination runs the ordered cleanup defined by ADR-1139 for remaining streams, subscriptions, and sinks. Attachment cleanup follows the ownership and generation rules in ADR-1209.

  ADR-1202 governs the inner control-stream record loop. A control stream may dispatch multiple operations over its lifetime, including when carrier reads split or coalesce application records.

  ## Context
  
  WebTransport is visible as a binding/spec surface but remains provisional in support-level governance. The target protocol set requires all tigr-asgi-contract WebTransport events to be represented explicitly while keeping native WT structure clear.
  
  The corrected BindingSpec model uses carrier/profile metadata for WT session, stream, and datagram variants. This preserves protocol-native distinctions without adding another cross-transport taxonomy axis.
  
  Tigrbl already has lane/framing policy proof and a limited Tigrcorn bridge test. Those tests prove classification and isolated event handling. They do not, by themselves, prove native WebTransport multiplexing under one session.
  
  ## Consequences
  
  - WebTransport session, bidi stream, unidi client stream, unidi server stream, and datagram behavior receive separate SPEC and test coverage.
  - App-framed WebTransport payloads are validated through profile-local framing policy.
  - Certification requires runtime evidence for profile handling and multiplexed session behavior where support is claimed.
  - Docs and support matrices must keep outer transport identity separate from inner payload framing claims.
  - Default table profiles can route CRUD/control operations to a control bidirectional stream, stream-shaped operations to unidirectional or bidirectional stream carriers, and datagram-shaped operations to datagram carriers without implying that all operations share one framing.
  - A future WebTransport multiplexing claim must show one `session_id` preserving independent stream and datagram identities across mixed-lane send and receive events.
  - WebTransport `profile` and runtime-internal lane classification remain transport-specific execution modeling and are not part of the cross-transport client-session coverage schema governed by ADR-1135.
  
  ## Related
  
  ADR-1005, ADR-1006, ADR-1007, ADR-1023, ADR-1024, ADR-1091, ADR-1092, ADR-1094, ADR-1131, ADR-1132, ADR-1133, ADR-1134, ADR-1135.
  
  ## Session and stream correlation
  
  Draft ADR-1207 assigns one correlation_id at WebTransport session acceptance and propagates it across every stream and datagram in the session. Each stream receives a distinct stream_correlation_id at establishment alongside its native stream_id. The requester’s session_id and the native transport_session_id serve separate purposes. Copy an available stable quic_connection_id for connection-level grouping.
