body: |-
  Declare strict JSON input on individual REST bindings to preserve compatibility for existing clients. The selected binding controls top-level shape and the wrong-shape status. Apply the same request policy in ordinary dispatch and packed input preparation so malformed input cannot fall through to path or query payloads.
