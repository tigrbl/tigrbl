body: |-
  A WebTransport control lane is one session-scoped, client-initiated, long-lived bidirectional stream. KernelPlan compiles the record-read, length-prefix decode, JSON-RPC decode, operation dispatch, JSON-RPC encode, length-prefix encode, and nonterminal stream-emit loop. Completing an operation completes one application record, not the carrier stream. Runtime adapters remain raw ASGI scope, receive, and send projection only. Explicit close or session cleanup terminates the control stream and associated subscription and media sinks.
