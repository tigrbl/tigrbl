body: |-
  Runtime events preserve parentage between concrete IDs and semantic owners. An attempt identifies an operation execution and links to its op_id, table_id, router_id, and app_id. Replay links to the original attempt. A stream or datagram belongs to a transport_session_id, and the transport session can be associated with the requester’s session_id.
  
  A transaction belongs to its engine_session_id. Link that transaction to each participating invocation or attempt. Multiple invocations may link to one transaction under an authorized owner, and one invocation may link to several transactions. These links preserve drillback without transferring commit or rollback authority. Draft ADR-1207 defines request, session, and stream correlation. Draft ADR-1208 defines transaction identity and lifecycle ownership.
  
  Runtime context, channel state, traces, qlog, replay, and rollups preserve the applicable parentage. Conformance verifies drillback and rejects missing or mismatched required parent scope.

  ## Connection and subscription parentage

  A connection owns its HTTP exchanges and transport sessions. The upgrade or CONNECT exchange links to the session it opened. A transport session owns its carrier lanes. Draft ADR-1209 links subscriptions to their opening invocation and to a currently authorized destination, with a separate lease and owner generation. Authorized resume updates destination and lease links while preserving the logical subscription. A delivery links a publication to a subscription and retains origin and recipient attribution.
