summary: "Tigrbl projects ASGI scope and messages into canonical runtime events, metadata, and identities. The tigrbl_atoms ingress projector exclusively reads the raw ASGI scope type for framework dispatch. Kernel plans govern semantic dispatch and lifecycle behavior."
