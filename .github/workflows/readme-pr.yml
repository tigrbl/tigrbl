# Reusable CI policy is pinned to a reviewed immutable revision.
# The checkout still tests the pull-request merge revision.
# Update these pins when changing workflow definitions.
name: Pull request CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  branch-coverage:
    uses: tigrbl/tigrbl/.github/workflows/branch-coverage.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  cli-smoke:
    uses: tigrbl/tigrbl/.github/workflows/cli-smoke.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  evidence-lanes:
    uses: tigrbl/tigrbl/.github/workflows/evidence-lanes.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  gate-b-surface-closure:
    uses: tigrbl/tigrbl/.github/workflows/gate-b-surface-closure.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  gate-c-conformance-security:
    uses: tigrbl/tigrbl/.github/workflows/gate-c-conformance-security.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  gate-d-reproducibility:
    uses: tigrbl/tigrbl/.github/workflows/gate-d-reproducibility.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  gate-e-promotion:
    uses: tigrbl/tigrbl/.github/workflows/gate-e-promotion.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  gate-runtime-boundary:
    uses: tigrbl/tigrbl/.github/workflows/gate-runtime-boundary.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  operator-surface:
    uses: tigrbl/tigrbl/.github/workflows/operator-surface.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  policy-governance:
    uses: tigrbl/tigrbl/.github/workflows/policy-governance.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  post-promotion-handoff:
    uses: tigrbl/tigrbl/.github/workflows/post-promotion-handoff.yml@c0a7a3c029afca407bc34b2e71e69f810fcb2626
  release-certification-automation:
