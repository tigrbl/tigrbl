# Reusable CI policy is pinned to a reviewed immutable revision.
# The checkout still tests the pull-request merge revision.
# Update these pins when changing workflow definitions.
name: Pull request CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  branch-coverage:
    uses: tigrbl/tigrbl/.github/workflows/branch-coverage.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  cli-smoke:
    uses: tigrbl/tigrbl/.github/workflows/cli-smoke.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  evidence-lanes:
    uses: tigrbl/tigrbl/.github/workflows/evidence-lanes.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  gate-b-surface-closure:
    uses: tigrbl/tigrbl/.github/workflows/gate-b-surface-closure.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  gate-c-conformance-security:
    uses: tigrbl/tigrbl/.github/workflows/gate-c-conformance-security.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  gate-d-reproducibility:
    uses: tigrbl/tigrbl/.github/workflows/gate-d-reproducibility.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  gate-e-promotion:
    uses: tigrbl/tigrbl/.github/workflows/gate-e-promotion.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  gate-runtime-boundary:
    uses: tigrbl/tigrbl/.github/workflows/gate-runtime-boundary.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  operator-surface:
    uses: tigrbl/tigrbl/.github/workflows/operator-surface.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  policy-governance:
    uses: tigrbl/tigrbl/.github/workflows/policy-governance.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  post-promotion-handoff:
    uses: tigrbl/tigrbl/.github/workflows/post-promotion-handoff.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  release-certification-automation:
    uses: tigrbl/tigrbl/.github/workflows/release-certification-automation.yml@d09c40a493f085a1177192c909cf35e023f9eda3
  readme-standards:
