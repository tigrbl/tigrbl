name: README standards
on:
  push:
    branches: [master, main, "release/**"]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readme-standards:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","trusted-public-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Enforce every active Python package README
        run: >-
          uv run --no-project --with readme-standards==0.1.1 pytest
          --readme-standards --readme-all --readme-root .
          -c tools/readme/pytest.ini --confcutdir tools/readme tools/readme
          --junitxml=readme-standards-results.xml
      - name: Reject undefined inputs in maintained Python examples
        run: >-
          uv run --no-project --with ruff==0.15.21 ruff check --isolated
          --select F821 --config 'include = ["**/docs/readme/*.py"]' .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-standards-results
          path: readme-standards-results.xml
