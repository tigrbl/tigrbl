name: Comparative Benchmark Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/comparative-benchmark-verification.yml"
      - "pkgs/210_tests/tigrbl_tests/benchmarks/comparative_benchmark_verification.py"
      - "pkgs/210_tests/tigrbl_tests/tests/perf/test_comparative_benchmark_verification.py"
      - "pkgs/210_tests/tigrbl_tests/tests/perf/test_tigrbl_vs_fastapi_create_benchmark.py"
      - "pkgs/210_tests/tigrbl_tests/tests/perf/helper_fastapi_create_app.py"
      - "pkgs/210_tests/tigrbl_tests/tests/perf/helper_tigrbl_create_app.py"

permissions:
  contents: read

concurrency:
  group: comparative-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-comparative-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dev dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-groups --no-install-workspace --locked
          uv pip install --no-deps --editable pkgs/000_typing/tigrbl_typing

      - name: Compute workspace PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          PY_PATH="$GITHUB_WORKSPACE/pkgs/210_tests/tigrbl_tests:$GITHUB_WORKSPACE"
          for base in "$GITHUB_WORKSPACE/pkgs"/*; do
            if [[ -d "$base" ]]; then
              for child in "$base"/*; do
                [[ -d "$child" ]] || continue
                PY_PATH="$PY_PATH:$child"
                if [[ -d "$child/src" ]]; then
                  PY_PATH="$PY_PATH:$child/src"
                fi
              done
            fi
          done
          PY_PATH="$PY_PATH:$GITHUB_WORKSPACE/pkgs/050_runtime/tigrbl_runtime"
          echo "PYTHONPATH=$PY_PATH" >> "$GITHUB_ENV"

      - name: Run metric extraction unit tests
        run: >-
          uv run --no-sync python -m pytest --noconftest -q
          pkgs/210_tests/tigrbl_tests/tests/perf/test_comparative_benchmark_verification.py
          -p no:cacheprovider

      - name: Run 250-op ASGITransport sequential benchmark
        run: >-
          uv run --no-sync python -m pytest -q -m perf
          pkgs/210_tests/tigrbl_tests/tests/perf/test_tigrbl_vs_fastapi_create_benchmark.py::test_tigrbl_vs_fastapi_asgitransport_sequential_10_rounds_randomized_comparison_250_ops

      - name: Run 250-op HTTPX real-transport sequential benchmark
        run: >-
          uv run --no-sync python -m pytest -q -m perf
          pkgs/210_tests/tigrbl_tests/tests/perf/test_tigrbl_vs_fastapi_create_benchmark.py::test_tigrbl_vs_fastapi_httpxtransport_sequential_10_rounds_randomized_comparison_250_ops

      - name: Measure the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$RUNNER_TEMP/tigrbl-comparative-base"
          output="$GITHUB_WORKSPACE/.tmp/comparative-benchmark"
          harness="$GITHUB_WORKSPACE/pkgs/210_tests/tigrbl_tests/benchmarks/comparative_benchmark_verification.py"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$baseline" "$BASE_SHA"
          cd "$baseline"
          uv sync --all-groups --no-install-workspace --locked
          uv pip install --no-deps --editable pkgs/*_typing/tigrbl_typing
          baseline_paths=("$baseline"/pkgs/*_tests/tigrbl_tests "$baseline")
          for package in "$baseline"/pkgs/*/*; do
            [[ -d "$package" ]] || continue
            baseline_paths+=("$package")
            if [[ -d "$package/src" ]]; then
              baseline_paths+=("$package/src")
            fi
          done
          export PYTHONPATH="$(IFS=:; echo "${baseline_paths[*]}")"
          export TIGRBL_BENCHMARK_ROOT="$baseline"
          .venv/bin/python "$harness" --no-fail \
            --json-output "$output/baseline.json" \
            --markdown-output "$output/baseline.md" \
            --oci-output-dir "$output/baseline-oci" \
            --oci-base-image python:3.12-slim

      - name: Measure the candidate and enforce the benchmark gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gate=()
          if [[ -n "$BASE_SHA" ]]; then
            gate=(--baseline-json .tmp/comparative-benchmark/baseline.json --expected-base-sha "$BASE_SHA")
          fi
          uv run --no-sync python \
            pkgs/210_tests/tigrbl_tests/benchmarks/comparative_benchmark_verification.py \
            "${gate[@]}" \
            --json-output pkgs/210_tests/tigrbl_tests/tests/perf/comparative_benchmark_verification.json \
            --markdown-output pkgs/210_tests/tigrbl_tests/tests/perf/comparative_benchmark_verification.md \
            --oci-output-dir .tmp/comparative-benchmark/oci \
            --oci-base-image python:3.12-slim

      - name: Upload comparative benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparative-benchmark-verification
          path: |
            pkgs/210_tests/tigrbl_tests/tests/perf/comparative_benchmark_verification.json
            pkgs/210_tests/tigrbl_tests/tests/perf/comparative_benchmark_verification.md
            pkgs/210_tests/tigrbl_tests/tests/perf/benchmark_results_create_asgitransport_sequential_10_rounds_250_ops.json
            pkgs/210_tests/tigrbl_tests/tests/perf/benchmark_results_create_httpxtransport_sequential_10_rounds_250_ops.json
            .tmp/comparative-benchmark/baseline.json
            .tmp/comparative-benchmark/baseline.md
            .tmp/comparative-benchmark/oci/*.tar.gz
            .tmp/comparative-benchmark/oci/**/Dockerfile
