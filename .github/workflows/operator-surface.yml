name: Operator Surface

on:
  workflow_call:
  push:
    branches: [master, main, "release/**"]
  workflow_dispatch:

jobs:
  operator-surface:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/tools/stubs:${{ github.workspace }}/pkgs/080_facade/tigrbl:${{ github.workspace }}/pkgs/040_atoms/tigrbl_atoms:${{ github.workspace }}/pkgs/020_base/tigrbl_base:${{ github.workspace }}/pkgs/997_deprecated_pending_migration/tigrbl_canon:${{ github.workspace }}/pkgs/150_client/tigrbl_client:${{ github.workspace }}/pkgs/070_concrete/tigrbl_concrete:${{ github.workspace }}/pkgs/010_core/tigrbl_core:${{ github.workspace }}/pkgs/045_kernel/tigrbl_kernel:${{ github.workspace }}/pkgs/060_ops/tigrbl_ops_olap:${{ github.workspace }}/pkgs/060_ops/tigrbl_ops_oltp:${{ github.workspace }}/pkgs/060_ops/tigrbl_ops_realtime:${{ github.workspace }}/pkgs/060_ops/tigrbl_ops_webtransport:${{ github.workspace }}/pkgs/030_orm/tigrbl_orm:${{ github.workspace }}/pkgs/050_runtime/tigrbl_runtime:${{ github.workspace }}/pkgs/001_spec/tigrbl_spec:${{ github.workspace }}/pkgs/210_tests/tigrbl_tests:${{ github.workspace }}/pkgs/000_typing/tigrbl_typing:${{ github.workspace }}/pkgs/050_runtime/tigrbl_runtime:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace dev dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-groups --no-install-workspace --frozen

      - name: Run operator-surface closure tests
        run: uv run --no-sync python -m pytest --noconftest -q pkgs/210_tests/tigrbl_tests/tests/unit/test_operator_surface_closure.py pkgs/210_tests/tigrbl_tests/tests/unit/test_operator_surface_docs_parity.py -p no:cacheprovider
