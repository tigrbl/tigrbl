name: Gate Runtime Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-boundary:
    runs-on:
      group: public-shortlived
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c5828cd144fe58d0e0bf756a83d91002a44bbfd
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime boundary
        run: python tools/ci/validate_runtime_boundary.py
      - name: Run runtime boundary tests
        run: uv run pytest pkgs/50_runtime/tigrbl_runtime/tests/test_runtime_boundary_contract.py
