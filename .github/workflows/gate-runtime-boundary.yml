name: Gate Runtime Boundary

on:
  workflow_call:
  push:
    branches: [master, main]
    paths:
      - "pkgs/50_runtime/tigrbl_runtime/**"
      - "tools/ci/validate_runtime_boundary.py"
      - ".github/workflows/gate-runtime-boundary.yml"

jobs:
  runtime-boundary:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","trusted-public-ci"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime boundary
        run: python tools/ci/validate_runtime_boundary.py
      - name: Run runtime boundary tests
        run: uv run pytest pkgs/50_runtime/tigrbl_runtime/tests/test_runtime_boundary_contract.py
