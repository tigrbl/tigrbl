name: Gate E Promotion

on:
  push:
    branches:
      - master
      - main
      - release/**
  workflow_dispatch:
  workflow_call:

concurrency:
  group: gate-e-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-e-promotion:
    runs-on: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/docs/readme-standards-20261119' || (github.event_name == 'pull_request' && github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["sad-lewin","shortlived","testing","trusted-public-ci","Linux","X64"]') || 'ubuntu-24.04' }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workspace dev dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --all-groups --no-install-workspace --frozen
          uv pip install --no-deps -e pkgs/000_typing/tigrbl_typing

      - name: Compute workspace PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          PY_PATH="$GITHUB_WORKSPACE"
          for base in "$GITHUB_WORKSPACE/pkgs"/*; do
            if [[ -d "$base" ]]; then
              for child in "$base"/*; do
                [[ -d "$child" ]] || continue
                PY_PATH="$PY_PATH:$child"
                if [[ -d "$child/src" ]]; then
                  PY_PATH="$PY_PATH:$child/src"
                fi
              done
            fi
          done
          PY_PATH="$PY_PATH:$GITHUB_WORKSPACE/pkgs/050_runtime/tigrbl_runtime"
          echo "PYTHONPATH=$PY_PATH" >> "$GITHUB_ENV"

      - name: Validate Gate E promotion closure
        run: uv run --no-sync python tools/ci/validate_gate_e_promotion.py

      - name: Run Gate E validator tests
        run: |
          mkdir -p .tmp .uv-cache .uv-pytest-tigrbl-tests
          export UV_CACHE_DIR="${GITHUB_WORKSPACE}/.uv-cache"
          export TMPDIR="${GITHUB_WORKSPACE}/.tmp"
          export TEMP="${GITHUB_WORKSPACE}/.tmp"
          export TMP="${GITHUB_WORKSPACE}/.tmp"
          uv run --no-sync python -m pytest -q tools/ci/tests/test_gate_e_promotion.py -p no:cacheprovider --basetemp .uv-pytest-tigrbl-tests

      - name: Run tigrbl_tests gate
        run: |
          mkdir -p .tmp .uv-cache .uv-pytest-tigrbl-tests
          export UV_CACHE_DIR="${GITHUB_WORKSPACE}/.uv-cache"
          export TMPDIR="${GITHUB_WORKSPACE}/.tmp"
          export TEMP="${GITHUB_WORKSPACE}/.tmp"
          export TMP="${GITHUB_WORKSPACE}/.tmp"
          uv pip install --no-deps -e pkgs/080_facade/tigrbl -e pkgs/050_runtime/tigrbl_runtime
          uv run --no-sync python -m pytest -q pkgs/210_tests/tigrbl_tests/tests -p no:cacheprovider --basetemp .uv-pytest-tigrbl-tests
