name: Bug report
description: Report a reproducible problem in Tigrbl.
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately using [SECURITY.md](https://github.com/tigrbl/tigrbl/blob/master/SECURITY.md).
  - type: input
    id: package
    attributes:
      label: Affected package and version
      placeholder: tigrbl 0.4.4
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.12"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest example and the commands needed to run it. Remove credentials and other sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the relevant error message or output, if any.
    validations:
      required: true
