[project]
name = "tigrbl-transport-trace-lab"
version = "0.1.0"
description = "Tigrbl trace collector and monitor"
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "tigrbl",
    "tigrbl-core",
    "tigrbl-trace==0.1.0",
    "tigrbl-engine-postgres",
    "tigrcorn[certification]==0.3.19",
    "tigr-asgi-contract",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.scripts]
tigrbl-trace-lab = "trace_lab.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_lab"]

[tool.uv.sources]
tigrbl-core = { workspace = true }
tigrbl = { workspace = true }
tigrbl-trace = { workspace = true }
tigrbl-engine-postgres = { workspace = true }

[tool.readme_standards]
policy = "package-guide-v1"
brand = "tigrbl"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl"
ref = "master"
package_path = "pkgs/110_backend/trace-lab-server"
layer = "110_backend"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tigrbl-transport-trace-lab"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/quick_start.sh"
test = "tests/test_collector.py"
language = "sh"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/verify.sh"
test = "tests/test_collector.py"
language = "sh"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/verify.yml"

[tool.readme_standards.statuses.tests]
label = "pytest suite"
url = "https://github.com/tigrbl/tigrbl/tree/master/pkgs/110_backend/trace-lab-server/tests"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/110_backend/trace-lab-server/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "registry"
url = "https://github.com/tigrbl/tigrbl/blob/master/.ssot/registry.json"

[tool.readme_standards.statuses.evidence]
label = "test evidence"
url = "https://github.com/tigrbl/tigrbl/tree/master/.ssot/evidence"
