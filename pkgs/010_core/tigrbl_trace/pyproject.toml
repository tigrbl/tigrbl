[project]
name = "tigrbl-trace"
version = "0.1.0"
description = "Wire validation and canonical timeline projection for Tigrbl traces."
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "tigrbl-typing>=0.4.6.dev2,<0.5",
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/tigrbl/tigrbl/tree/master/pkgs/010_core/tigrbl_trace"
Issues = "https://github.com/tigrbl/tigrbl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tigrbl_trace"]

[tool.uv.sources]
tigrbl-typing = { workspace = true }

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl"
ref = "master"
package_path = "pkgs/010_core/tigrbl_trace"
layer = "010_core"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tigrbl-trace"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "pytest suite"
url = "https://github.com/tigrbl/tigrbl/tree/master/pkgs/010_core/tigrbl_trace/tests"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/010_core/tigrbl_trace/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"
