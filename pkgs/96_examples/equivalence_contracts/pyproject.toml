[project]
name = "tigrbl-equivalence-contracts"
version = "0.0.0+local"
description = "Local runtime demonstrations for certifiable Tigrbl equivalence claims."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "fastapi>=0.111",
    "tigrbl-core",
    "tigrbl",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[dependency-groups]
dev = [
    "aiosqlite>=0.19.0",
    "asyncpg>=0.30.0",
    "build>=1.2.0",
    "flake8>=7.0",
    "greenlet>=3.2.3",
    "gunicorn>=21.2.0",
    "hatchling>=1.27.0",
    "hypercorn>=0.16.0",
    "httpx>=0.27.0,<0.28",
    "jinja2>=3.1.4",
    "poetry-core>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "python-dotenv",
    "pyyaml",
    "requests>=2.32.3",
    "ruff>=0.11.0",
    "ssot-registry>=0.2.26",
    "sqlalchemy>=2.0",
    "tomli-w",
    "typing-extensions>=4.0",
    "uvicorn",
    "websockets>=13",
    "readme-standards==0.1.3; python_version >= \"3.11\"",
]

[tool.uv]
package = true

[tool.uv.sources]
"tigrbl-core" = { path = "../../10_core/tigrbl_core", editable = true }
"tigrbl" = { path = "../../80_facade/tigrbl", editable = true }
"tigrbl-typing" = { path = "../../00_typing/tigrbl_typing", editable = true }
"tigrbl_spec" = { path = "../../01_spec/tigrbl_spec", editable = true }

[tool.tigrbl]
publish = false
purpose = "local-certification-demo"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl"
ref = "master"
package_path = "pkgs/96_examples/equivalence_contracts"
layer = "96_examples"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tigrbl-equivalence-contracts"
published = false

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/96_examples/equivalence_contracts/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/96_examples/equivalence_contracts/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tigrbl_equivalence_contracts"]
