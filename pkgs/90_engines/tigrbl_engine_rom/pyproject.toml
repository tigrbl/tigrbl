[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tigrbl_engine_rom"
version = "0.4.5.dev4"
description = "Immutable read-only memory engine plugin for Tigrbl."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["tigrbl", "engine", "plugin", "memory", "readonly", "immutable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
requires-python = ">=3.10,<3.15"
dependencies = ["tigrbl>=0.3.0.dev4"]

[project.urls]
Homepage = "https://github.com/tigrbl/tigrbl"
Repository = "https://github.com/tigrbl/tigrbl/tree/master/pkgs/90_engines/tigrbl_engine_rom"
Issues = "https://github.com/tigrbl/tigrbl/issues"

[project.entry-points."tigrbl.engine_plugins"]
rom = "tigrbl_engine_rom.plugin:register"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.11.0", "sqlalchemy>=2.0"]

[tool.uv.sources]
tigrbl = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
