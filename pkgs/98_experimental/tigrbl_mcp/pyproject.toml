[project]
name = "tigrbl-mcp-server-demo"
version = "0.1.0"
description = "MCP 2025-11-25 server backed by Tigrbl operations."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "mcp>=1.28,<2",
  "tigrbl",
  "tigrbl-core",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
tigrbl = { path = "../../80_facade/tigrbl", editable = true }
tigrbl-core = { path = "../../10_core/tigrbl_core", editable = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
