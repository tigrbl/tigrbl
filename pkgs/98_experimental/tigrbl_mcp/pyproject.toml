[project]
name = "tigrbl-mcp"
version = "0.1.0"
description = "Experimental low-level MCP SDK integration for Tigrbl operations."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "mcp>=1.28,<2",
  "tigrbl",
  "tigrbl-core",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
tigrbl = { workspace = true }
tigrbl-core = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
