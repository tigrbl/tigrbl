[project]
name = "tigrbl_model"
version = "0.4.6.dev2"
description = "Pydantic-independent validation, serialization, and JSON Schema models for Tigrbl."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "typing-extensions>=4.0; python_version < '3.11'",
]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Organization = "https://github.com/tigrbl"
Repository = "https://github.com/tigrbl/tigrbl/tree/master/pkgs/02_model/tigrbl_model"
Issues = "https://github.com/tigrbl/tigrbl/issues"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_model" }]
include = ["tigrbl_model/py.typed"]

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl"
ref = "master"
package_path = "pkgs/02_model/tigrbl_model"
layer = "02_model"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tigrbl_model"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/02_model/tigrbl_model/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/02_model/tigrbl_model/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"
[dependency-groups]
dev = [
    "pydantic>=2.10,<3",
    "pytest>=8.0",
    "ruff>=0.9.9",
    "readme-standards==0.1.1; python_version >= \"3.11\"",
]
