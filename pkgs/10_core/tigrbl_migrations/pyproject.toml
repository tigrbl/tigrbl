[project]
name = "tigrbl-migrations"
version = "0.4.6.dev2"
description = "Component manifests, migration DAGs, schema ownership, ledgers, and deployment locks for Tigrbl."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
dependencies = [
    "packaging>=24",
    "tomli>=2.0; python_version < '3.11'",
]
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.tigrbl.manifest]
version = "1.0.0"

[tool.readme_standards]
policy = "package-guide-v1"
readme = "README.md"
brand = "tigrbl"
brand_catalog = "../../../tools/readme/brands.toml"
repository = "https://github.com/tigrbl/tigrbl"
ref = "master"
package_path = "pkgs/10_core/tigrbl_migrations"
layer = "10_core"
lifecycle = "active"
license_file = "LICENSE"
notice_file = "NOTICE"

[tool.readme_standards.distributions.pypi]
name = "tigrbl-migrations"
published = true

[tool.readme_standards.examples.quick_start]
source = "docs/readme/quick_start.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.examples.usage]
source = "docs/readme/usage.py"
test = "docs/readme/test_examples.py"
language = "python"
expected_exit_code = 0

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "example source"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/10_core/tigrbl_migrations/docs/readme/test_examples.py"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/tigrbl/tigrbl/blob/master/pkgs/10_core/tigrbl_migrations/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "repository policy"
url = "https://github.com/tigrbl/tigrbl/blob/master/tools/readme/POLICY.md"

[tool.readme_standards.statuses.evidence]
label = "source and CI"
url = "https://github.com/tigrbl/tigrbl/actions/workflows/readme-standards.yml"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tigrbl_migrations" }]
include = ["tigrbl_migrations/manifest_protocol.toml"]

[dependency-groups]
dev = ["readme-standards==0.1.1; python_version >= \"3.11\""]
